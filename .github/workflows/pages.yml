name: Deploy GitHub Pages redirect

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is served by Vercel at https://quantum.litkhai.dev. Pages keeps
      # litkhai.github.io/notes-on-quantum/ alive by publishing one redirect
      # stub per built page, each sending to the same path on the new host.
      # The pre-rename path litkhai.github.io/quantum-notes/ is served by the
      # litkhai.github.io repository (redirect/quantum-notes/).
      - name: Build site
        run: mkdocs build --strict --site-dir "${RUNNER_TEMP}/notes-on-quantum-site"

      - name: Generate redirect stubs
        run: >
          python scripts/pages-redirect.py
          "${RUNNER_TEMP}/notes-on-quantum-site" "${RUNNER_TEMP}/pages-redirect"
          https://quantum.litkhai.dev /notes-on-quantum

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-redirect

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
